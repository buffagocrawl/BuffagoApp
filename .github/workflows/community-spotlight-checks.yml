name: Community spotlight checks
on:
  pull_request:
    paths:
      - 'Agents/Jalapeno/spotlight/**'
      - 'Agents/Jalapeno/spotlight_main.py'
      - 'Agents/Jalapeno/guess_wing_spot/sources.py'
      - 'Agents/Jalapeno/tests/test_community_spotlight.py'
      - 'Agents/Jalapeno/tests/test_spotlight_verification.py'
      - '.github/workflows/community-spotlight*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==12.0.0' 'requests==2.32.5' 'pytest==9.0.2' 'PyYAML==6.0.3'
      - run: python -m pytest Agents/Jalapeno/tests/test_community_spotlight.py Agents/Jalapeno/tests/test_spotlight_verification.py Agents/Jalapeno/tests/test_guess_wing_spot.py Agents/Jalapeno/tests/test_guess_wing_spot_publish.py Agents/Jalapeno/tests/test_reel_latest_weekly.py Agents/Jalapeno/tests/test_reel_analytics.py -q

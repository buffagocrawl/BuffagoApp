name: BuffaGo community restaurant spotlight
on:
  schedule:
    # Both UTC offsets, with the Eastern runtime gate admitting only noon.
    - cron: '0,20,40 16,17 * * 0,1,3,5,6'
    # Read-only missed/pending audit after the window, for either DST offset.
    - cron: '5 17,18 * * 0,1,3,5,6'
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only plan/health, or resume the current noon publication slot
        type: choice
        default: plan
        options: [plan, health, publish]
      publication_date:
        description: Pi automatic Eastern date (manual runs leave empty)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: community-spotlight
  cancel-in-progress: false
jobs:
  spotlight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMMUNITY_SPOTLIGHT_ENABLED: ${{ vars.COMMUNITY_SPOTLIGHT_ENABLED || 'false' }}
      COMMUNITY_SPOTLIGHT_SCHEDULER: ${{ vars.COMMUNITY_SPOTLIGHT_SCHEDULER || 'github' }}
      PUBLICATION_DATE: ${{ inputs.publication_date }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      META_LONG_LIVED_ACCESS_TOKEN: ${{ secrets.META_LONG_LIVED_ACCESS_TOKEN }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
      GUESS_EXPECTED_INSTAGRAM_USERNAME: ${{ vars.GUESS_EXPECTED_INSTAGRAM_USERNAME }}
      GUESS_EXPECTED_FACEBOOK_NAME: ${{ vars.GUESS_EXPECTED_FACEBOOK_NAME }}
      GITHUB_TOKEN: ${{ github.token }}
      REQUESTED_MODE: ${{ inputs.mode || 'publish' }}
      TRIGGER_CRON: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==12.0.0' 'requests==2.32.5' 'pytest==9.0.2' 'PyYAML==6.0.3'
      - name: Mock-only source, rotation, schedule and provider recovery checks
        run: python -m pytest Agents/Jalapeno/tests/test_community_spotlight.py Agents/Jalapeno/tests/test_spotlight_verification.py -q
      - name: Plan, publish or audit this Eastern slot
        shell: bash
        run: |
          mode="$REQUESTED_MODE"
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$TRIGGER_CRON" == '5 '* ]]; then mode=health; fi
          python -B Agents/Jalapeno/spotlight_main.py "$mode"

name: Jalapeno Reel Analytics - Instagram and Facebook

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Safe collection, honest current-age backfill, or read-only diagnostics
        type: choice
        default: diagnostic
        options: [diagnostic, collect, backfill]
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 1 * * *'

permissions:
  contents: read

concurrency:
  group: jalapeno-reel-analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_LONG_LIVED_ACCESS_TOKEN: ${{ secrets.META_LONG_LIVED_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
      GUESS_EXPECTED_INSTAGRAM_USERNAME: ${{ vars.GUESS_EXPECTED_INSTAGRAM_USERNAME }}
      GUESS_EXPECTED_FACEBOOK_NAME: ${{ vars.GUESS_EXPECTED_FACEBOOK_NAME }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
      METRICS_MODE: ${{ github.event_name == 'schedule' && 'collect' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated analytics dependencies
        run: python -m pip install 'requests>=2.32,<3' 'pytest>=8,<10' 'tzdata>=2024.1' 'PyYAML>=6,<7'
      - name: Verify analytics behavior and mutation protections before any credentialed collection
        run: python -B -m pytest Agents/Jalapeno/tests/test_reel_analytics.py -q -o cache_dir="$RUNNER_TEMP/analytics-tests-cache" --basetemp="$RUNNER_TEMP/analytics-tests"
      - name: Read-only diagnostics or analytics-only collection (DST gated at 20:30 Eastern)
        run: python -B Agents/Jalapeno/reel_metrics.py "$METRICS_MODE"

name: Jalapeno Instagram Schedule

on:
  workflow_dispatch:
    inputs:
      post_type:
        description: Select which Jalapeno post type to run
        required: true
        type: choice
        default: buffago
        options:
          - buffago
          - meme
      publish:
        description: Run the live production publish pipeline
        required: true
        type: boolean
        default: false
  schedule:
    # GitHub Actions cron uses UTC in this workflow format.
    # These values match Eastern Daylight Time:
    # - 4:00 PM ET  -> 20:00 UTC
    # - 8:00 PM ET  -> 00:00 UTC next day
    # When Eastern Standard Time resumes, update to:
    # - 4:00 PM ET  -> 21:00 UTC
    # - 8:00 PM ET  -> 01:00 UTC next day
    - cron: "0 20 * * *"
    - cron: "0 0 * * *"

jobs:
  jalapeno-instagram:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: Jalapeno
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_LONG_LIVED_ACCESS_TOKEN: ${{ secrets.META_LONG_LIVED_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      GITHUB_WORKFLOW_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jalapeno dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve run parameters
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            case "${GITHUB_EVENT_SCHEDULE}" in
              "0 20 * * *")
                post_type="buffago"
                run_label="scheduled_4pm_eastern"
                mode="production"
                ;;
              "0 0 * * *")
                post_type="meme"
                run_label="scheduled_8pm_eastern"
                mode="production"
                ;;
              *)
                echo "Unsupported schedule trigger: ${GITHUB_EVENT_SCHEDULE}" >&2
                exit 1
                ;;
            esac
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            post_type="${{ inputs.post_type }}"
            case "${post_type}" in
              buffago|meme) ;;
              *)
                echo "Invalid POST_TYPE '${post_type}'. Valid values: buffago, meme" >&2
                exit 1
                ;;
            esac
            if [[ "${{ inputs.publish }}" == "true" ]]; then
              run_label="manual_dispatch_production"
              mode="production"
            else
              run_label="manual_dispatch_dry_run"
              mode="dry-run"
            fi
          else
            echo "Unsupported event source: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi

          if [[ "${mode}" == "production" ]]; then
            command="python main.py --production"
            dry_run="false"
          else
            command="python main.py --dry-run"
            dry_run="true"
          fi

          {
            echo "POST_TYPE=${post_type}"
            echo "JALAPENO_RUN_LABEL=${run_label}"
            echo "JALAPENO_MODE=${mode}"
            echo "JALAPENO_COMMAND=${command}"
            echo "JALAPENO_DRY_RUN=${dry_run}"
          } >> "${GITHUB_ENV}"

          echo "run_source=${GITHUB_EVENT_NAME}"
          echo "post_type=${post_type}"
          echo "mode=${mode}"
          echo "dry_run=${dry_run}"
          echo "workflow_run_id=${GITHUB_RUN_ID}"

      - name: Validate required secrets
        run: |
          set -euo pipefail

          required_vars=(
            FACEBOOK_PAGE_ID
            INSTAGRAM_BUSINESS_ACCOUNT_ID
          )

          if [[ "${JALAPENO_MODE}" == "production" ]]; then
            required_vars+=(
              SUPABASE_URL
              SUPABASE_SERVICE_ROLE_KEY
              META_APP_SECRET
              META_LONG_LIVED_ACCESS_TOKEN
              OPENAI_API_KEY
            )
          fi

          missing=()
          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              missing+=("${var_name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secrets/env values for %s: %s\n' "${JALAPENO_MODE}" "${missing[*]}" >&2
            exit 1
          fi

      - name: Run Jalapeno
        run: |
          set +e

          echo "run_label=${JALAPENO_RUN_LABEL}"
          echo "run_source=${GITHUB_EVENT_NAME}"
          echo "post_type=${POST_TYPE}"
          echo "dry_run=${JALAPENO_DRY_RUN}"
          echo "workflow_run_id=${GITHUB_RUN_ID}"
          echo "command=${JALAPENO_COMMAND}"

          ${JALAPENO_COMMAND}
          exit_code=$?

          if [[ ${exit_code} -eq 0 ]]; then
            echo "status=success"
          else
            echo "status=failure"
          fi

          exit ${exit_code}

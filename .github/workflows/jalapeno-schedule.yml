name: Jalapeño Community Wing Shots Nightly

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run is safe; live also requires explicit confirmation, repository gates, platform flags, and per-job human approval.
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - live
      business_date:
        description: Optional America/New_York business date (YYYY-MM-DD). Live runs accept today or the prior seven days.
        required: false
        type: string
      live_confirmation:
        description: For live only, enter PUBLISH_APPROVED_COMMUNITY_WING_SHOTS
        required: false
        type: string
  schedule:
    # 05:17 UTC avoids the top-of-hour congestion window and is 12:17 AM EST
    # or 1:17 AM EDT. The runner resolves the America/New_York business date.
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: jalapeno-community-wing-shots-nightly
  cancel-in-progress: false

jobs:
  community-wing-shots:
    name: Curate approved community Wing Shots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: Agents/Jalapeno
    env:
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
      WING_SHOTS_LIVE_PUBLISHING_ENABLED: ${{ vars.WING_SHOTS_LIVE_PUBLISHING_ENABLED || 'false' }}
      WING_INSTAGRAM_PUBLISHING_ENABLED: ${{ vars.WING_INSTAGRAM_PUBLISHING_ENABLED || 'false' }}
      WING_FACEBOOK_PUBLISHING_ENABLED: ${{ vars.WING_FACEBOOK_PUBLISHING_ENABLED || 'false' }}
      REQUESTED_RUN_MODE: ${{ github.event_name == 'schedule' && 'dry-run' || inputs.mode }}
      REQUESTED_BUSINESS_DATE: ${{ inputs.business_date || '' }}
      REQUESTED_LIVE_CONFIRMATION: ${{ inputs.live_confirmation || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Agents/Jalapeno/requirements.txt

      - name: Install community runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate run mode and configuration
        id: resolve
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_LONG_LIVED_ACCESS_TOKEN: ${{ secrets.META_LONG_LIVED_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          set -euo pipefail

          guard_args=(validate --mode "${REQUESTED_RUN_MODE}")
          if [[ -n "${REQUESTED_BUSINESS_DATE}" ]]; then
            guard_args+=(--business-date "${REQUESTED_BUSINESS_DATE}")
          fi
          if [[ -n "${REQUESTED_LIVE_CONFIRMATION}" ]]; then
            guard_args+=(--live-confirmation "${REQUESTED_LIVE_CONFIRMATION}")
          fi
          set +e
          validation_json="$(
            python -m scheduling.community_schedule_guard "${guard_args[@]}"
          )"
          validation_exit_code=$?
          set -e
          if [[ ${validation_exit_code} -eq 0 ]]; then
            business_date="$(
              python -c 'import json,sys; print(json.load(sys.stdin)["business_date"])' \
                <<< "${validation_json}"
            )"
          else
            business_date="$(TZ=America/New_York date +%F)"
          fi

          {
            echo "run_mode=${REQUESTED_RUN_MODE}"
            echo "business_date=${business_date}"
            echo "validation_exit_code=${validation_exit_code}"
          } >> "${GITHUB_OUTPUT}"

          echo "community_wing_shots=true"
          echo "run_mode=${REQUESTED_RUN_MODE}"
          echo "business_date=${business_date}"
          echo "configuration_valid=$([[ ${validation_exit_code} -eq 0 ]] && echo true || echo false)"
          echo "human_final_approval_required=true"
          echo "legacy_content_generation_enabled=false"

      - name: Run community Wing Shots
        id: run
        if: steps.resolve.outputs.validation_exit_code == '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_LONG_LIVED_ACCESS_TOKEN: ${{ secrets.META_LONG_LIVED_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          set -euo pipefail

          stdout_file="${RUNNER_TEMP}/wing-shots-stdout.json"
          stderr_file="${RUNNER_TEMP}/wing-shots-stderr.log"
          args=(--business-date "${{ steps.resolve.outputs.business_date }}")
          if [[ "${{ steps.resolve.outputs.run_mode }}" == "live" ]]; then
            args+=(--live)
          fi

          set +e
          python wing_shots_main.py "${args[@]}" \
            > "${stdout_file}" 2> "${stderr_file}"
          entrypoint_exit_code=$?
          set -e

          {
            echo "entrypoint_exit_code=${entrypoint_exit_code}"
            echo "stdout_file=${stdout_file}"
          } >> "${GITHUB_OUTPUT}"
          echo "entrypoint_exit_code=${entrypoint_exit_code}"

      - name: Build safe nightly receipt
        id: receipt
        if: always()
        run: |
          set -euo pipefail

          receipt_dir="${RUNNER_TEMP}/wing-shots-receipt"
          receipt_file="${receipt_dir}/nightly-receipt.json"
          stdout_file="${{ steps.run.outputs.stdout_file }}"
          entrypoint_exit_code="${{ steps.run.outputs.entrypoint_exit_code }}"
          if [[ "${{ steps.resolve.outputs.validation_exit_code || '2' }}" != "0" ]]; then
            entrypoint_exit_code=2
          fi
          if [[ -z "${stdout_file}" || ! -f "${stdout_file}" ]]; then
            stdout_file="${RUNNER_TEMP}/wing-shots-no-entrypoint-output"
            : > "${stdout_file}"
          fi
          if [[ -z "${entrypoint_exit_code}" ]]; then
            entrypoint_exit_code=1
          fi
          set +e
          python -m scheduling.community_schedule_guard receipt \
            --mode "${{ steps.resolve.outputs.run_mode || 'dry-run' }}" \
            --business-date "${{ steps.resolve.outputs.business_date }}" \
            --exit-code "${entrypoint_exit_code}" \
            --stdout-file "${stdout_file}" \
            --output "${receipt_file}"
          receipt_exit_code=$?
          set -e

          {
            echo "receipt_exit_code=${receipt_exit_code}"
            echo "receipt_file=${receipt_file}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload safe nightly receipt
        if: always() && steps.receipt.outputs.receipt_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: wing-shots-nightly-${{ steps.resolve.outputs.business_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.receipt.outputs.receipt_file }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce successful receipt
        if: always()
        run: |
          set -euo pipefail

          if [[ "${{ steps.resolve.outputs.validation_exit_code || '2' }}" != "0" ]]; then
            echo "Wing Shots configuration validation failed." >&2
            exit 1
          fi
          if [[ "${{ steps.run.outputs.entrypoint_exit_code || '1' }}" != "0" ]]; then
            echo "Wing Shots entrypoint failed; no provider success was claimed." >&2
            exit 1
          fi
          if [[ "${{ steps.receipt.outputs.receipt_exit_code || '1' }}" != "0" ]]; then
            echo "Wing Shots receipt validation failed." >&2
            exit 1
          fi

          echo "Community Wing Shots run completed with a validated safe receipt."

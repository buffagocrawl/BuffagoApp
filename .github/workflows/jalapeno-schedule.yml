name: Jalapeño — Publish Approved Wing Shot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Render a private preview or publish to the selected platforms.
        required: true
        type: choice
        default: dry_run
        options: [dry_run, publish]
      platform:
        description: Platforms to process.
        required: true
        type: choice
        default: both
        options: [both, instagram, facebook]
      submission_id:
        description: Optional approved Wing Shot UUID.
        required: false
        type: string
      skip_location_lookup:
        description: Skip best-effort restaurant location matching.
        required: false
        type: boolean
        default: false
      keep_processed_artifact:
        description: Keep the private processed artifact after the run.
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: jalapeno-social-publisher
  cancel-in-progress: false

jobs:
  publish-approved-wing-shot:
    name: Publish one Mango Habanero Approved Queue Wing Shot
    if: github.event_name == 'workflow_dispatch' || vars.JALAPENO_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: Agents/Jalapeno
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      META_LONG_LIVED_ACCESS_TOKEN: ${{ secrets.META_LONG_LIVED_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
      WING_SHOTS_LIVE_PUBLISHING_ENABLED: ${{ vars.WING_SHOTS_LIVE_PUBLISHING_ENABLED || 'false' }}
      WING_INSTAGRAM_PUBLISHING_ENABLED: ${{ vars.WING_INSTAGRAM_PUBLISHING_ENABLED || 'false' }}
      WING_FACEBOOK_PUBLISHING_ENABLED: ${{ vars.WING_FACEBOOK_PUBLISHING_ENABLED || 'false' }}
      GITHUB_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Agents/Jalapeno/requirements.txt

      - name: Install Jalapeño dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Verify media toolchain
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Run Approved Queue pipeline
        env:
          REQUESTED_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
          REQUESTED_PLATFORM: ${{ github.event_name == 'schedule' && 'both' || inputs.platform }}
          REQUESTED_SUBMISSION_ID: ${{ inputs.submission_id || '' }}
          REQUESTED_SKIP_LOCATION_LOOKUP: ${{ inputs.skip_location_lookup || 'false' }}
          REQUESTED_KEEP_ARTIFACT: ${{ inputs.keep_processed_artifact || 'false' }}
        run: |
          set -euo pipefail
          args=(--mode "${REQUESTED_MODE}" --platform "${REQUESTED_PLATFORM}")
          if [[ -n "${REQUESTED_SUBMISSION_ID}" ]]; then args+=(--submission-id "${REQUESTED_SUBMISSION_ID}"); fi
          if [[ "${REQUESTED_SKIP_LOCATION_LOOKUP}" == "true" ]]; then args+=(--skip-location-lookup); fi
          if [[ "${REQUESTED_KEEP_ARTIFACT}" == "true" ]]; then args+=(--keep-processed-artifact); fi
          python wing_shots_main.py "${args[@]}" | tee "${RUNNER_TEMP}/jalapeno-approved-wing-shot.json"

      - name: Upload private dry-run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jalapeno-approved-wing-shot-${{ github.run_id }}
          path: ${{ runner.temp }}/jalapeno-approved-wing-shot.json
          if-no-files-found: ignore
          retention-days: 14

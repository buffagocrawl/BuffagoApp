name: Jalapeno Instagram Schedule

on:
  workflow_dispatch:
    inputs:
      post_type:
        description: Select which Jalapeno post type to run
        required: true
        type: choice
        default: buffago
        options:
          - buffago
          - video
      publish:
        description: Run the live production publish pipeline
        required: true
        type: boolean
        default: false
  schedule:
    # GitHub Actions cron uses UTC in this workflow format.
    # GitHub documents higher delay/drop risk at the start of every hour:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
    # These values target Eastern Daylight Time. The Python entrypoint also
    # enforces a 0-90 minute America/New_York local-time publish window.
    # - 6:00 PM ET video daily run       -> 22:00 UTC
    # - 8:00 PM ET Buffago cadence run  -> 00:00 UTC next day
    # When Eastern Standard Time resumes, update to:
    # - 6:00 PM ET video daily run       -> 23:00 UTC
    # - 8:00 PM ET Buffago cadence run  -> 01:00 UTC next day
    - cron: "0 22 * * *"
    - cron: "0 0 */3 * *"

jobs:
  jalapeno-instagram:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: Agents/Jalapeno
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_LONG_LIVED_ACCESS_TOKEN: ${{ secrets.META_LONG_LIVED_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      GITHUB_WORKFLOW_RUN_ID: ${{ github.run_id }}
      JALAPENO_EVENT_SCHEDULE: ${{ github.event.schedule }}

    steps:
      - name: Log GitHub trigger context
        working-directory: .
        run: |
          set -euo pipefail

          echo "github_event=${GITHUB_EVENT_NAME}"
          echo "github_schedule=${JALAPENO_EVENT_SCHEDULE:-}"
          echo "current_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "current_et=$(TZ=America/New_York date +"%Y-%m-%dT%H:%M:%S%z")"
          echo "workflow_name=${GITHUB_WORKFLOW}"
          echo "branch=${GITHUB_REF_NAME}"
          echo "run_source=${GITHUB_EVENT_NAME}"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "github_actor=${GITHUB_ACTOR}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "workflow_ref=${GITHUB_WORKFLOW_REF}"
          echo "sha=${GITHUB_SHA}"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Jalapeno dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve run parameters
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            matched_schedule="${JALAPENO_EVENT_SCHEDULE:-}"
            case "${matched_schedule}" in
              "0 22 * * *")
                post_type="video"
                run_label="video_daily_run"
                mode="production"
                expected_schedule="0 22 * * *"
                ;;
              "0 0 */3 * *")
                post_type="buffago"
                run_label="buffago_three_day_run"
                mode="production"
                expected_schedule="0 0 */3 * *"
                ;;
              *)
                echo "Unsupported schedule trigger: ${matched_schedule}" >&2
                exit 1
                ;;
            esac
            echo "utc_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "america_new_york_time=$(TZ=America/New_York date +"%Y-%m-%dT%H:%M:%S%z")"
            echo "matched_cron=${matched_schedule}"
            echo "matched_schedule=${matched_schedule}"
            echo "expected_schedule=${expected_schedule}"
            echo "resolved_post_type=${post_type}"
            echo "resolved_content_type=${post_type}"
            echo "resolved_mode=${mode}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            post_type="${{ inputs.post_type }}"
            case "${post_type}" in
              buffago|video) ;;
              *)
                echo "Invalid POST_TYPE '${post_type}'. Valid values: buffago, video" >&2
                exit 1
                ;;
            esac
            if [[ "${{ inputs.publish }}" == "true" ]]; then
              run_label="manual_dispatch_production"
              mode="production"
            else
              run_label="manual_dispatch_dry_run"
              mode="dry-run"
            fi
          else
            echo "Unsupported event source: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi

          if [[ "${mode}" == "production" ]]; then
            command="python main.py --production --content-type ${post_type}"
            dry_run="false"
          else
            command="python main.py --dry-run"
            dry_run="true"
          fi

          {
            echo "POST_TYPE=${post_type}"
            echo "JALAPENO_RUN_LABEL=${run_label}"
            echo "JALAPENO_MODE=${mode}"
            echo "JALAPENO_COMMAND=${command}"
            echo "JALAPENO_DRY_RUN=${dry_run}"
          } >> "${GITHUB_ENV}"

          echo "run_source=${GITHUB_EVENT_NAME}"
          echo "post_type=${post_type}"
          echo "mode=${mode}"
          echo "dry_run=${dry_run}"
          echo "workflow_run_id=${GITHUB_RUN_ID}"

      - name: Validate required secrets
        run: |
          set -euo pipefail

          required_vars=(
            FACEBOOK_PAGE_ID
            INSTAGRAM_BUSINESS_ACCOUNT_ID
          )

          if [[ "${JALAPENO_MODE}" == "production" ]]; then
            required_vars+=(
              SUPABASE_URL
              SUPABASE_SERVICE_ROLE_KEY
              META_APP_SECRET
              META_LONG_LIVED_ACCESS_TOKEN
              OPENAI_API_KEY
            )
          fi

          missing=()
          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              missing+=("${var_name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secrets/env values for %s: %s\n' "${JALAPENO_MODE}" "${missing[*]}" >&2
            exit 1
          fi

      - name: Run Jalapeno
        run: |
          set +e

          echo "run_label=${JALAPENO_RUN_LABEL}"
          echo "run_source=${GITHUB_EVENT_NAME}"
          echo "post_type=${POST_TYPE}"
          echo "dry_run=${JALAPENO_DRY_RUN}"
          echo "workflow_run_id=${GITHUB_RUN_ID}"
          echo "command=${JALAPENO_COMMAND}"

          ${JALAPENO_COMMAND}
          exit_code=$?

          if [[ ${exit_code} -eq 0 ]]; then
            echo "status=success"
          else
            echo "status=failure"
          fi

          exit ${exit_code}

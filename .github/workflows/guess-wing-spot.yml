name: Jalapeño — Guess the Wing Spot Reels

on:
  schedule:
    # Same UTC slots, split only to distinguish inactive DST slots from late
    # eligible attempts. Pi is the delivery authority when configured.
    - cron: '10 23 * * *'
    - cron: '30 23 * * *'
    - cron: '50 23 * * *'
    - cron: '10 0 * * *'
    - cron: '30 0 * * *'
    - cron: '50 0 * * *'
    - cron: '10 1 * * *'
    - cron: '30 1 * * *'
    - cron: '50 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Plan/preview are local-only; publish uses the private daily ledger.
        type: choice
        default: plan
        options: [plan, preview, validate, publish, live-test, health]
      publication_date:
        description: Eastern target date for dated automatic attempts or read-only health; blank for manual work.
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: guess-wing-spot-daily
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.clock.outputs.proceed }}
      mode: ${{ steps.clock.outputs.mode }}
      audit: ${{ steps.clock.outputs.audit }}
      audit_date: ${{ steps.clock.outputs.audit_date }}
    steps:
      - uses: actions/checkout@v4
      - id: clock
        name: Gate Eastern date, DST trigger, publication window, and new enable control
        env:
          REQUESTED_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          GUESS_WING_SPOT_ENABLED: ${{ vars.GUESS_WING_SPOT_ENABLED || 'false' }}
          JALAPENO_SCHEDULER: ${{ vars.JALAPENO_SCHEDULER || 'github' }}
          PUBLICATION_DATE: ${{ inputs.publication_date || '' }}
        run: |
          python - <<'PY'
          import os, sys
          from datetime import datetime, timezone
          sys.path.insert(0, 'Agents/Jalapeno')
          from guess_wing_spot.clock_gate import gate, closed_publication_date
          mode = os.environ['REQUESTED_MODE']
          now = datetime.now(timezone.utc)
          result = gate(now, event=os.environ['GITHUB_EVENT_NAME'], cron=os.environ['GITHUB_EVENT_SCHEDULE'], mode=mode, scheduler=os.environ.get('JALAPENO_SCHEDULER','github'), automatic_date=os.environ.get('PUBLICATION_DATE',''))
          proceed = result['proceed'] and (mode not in {'publish', 'live-test'} or (os.environ['GUESS_WING_SPOT_ENABLED'] == 'true' and os.environ['GITHUB_REF'] == 'refs/heads/main'))
          reason = result['reason'] if not result['proceed'] or proceed else 'workflow_disabled_or_not_main'
          publishing = proceed and mode in {'publish', 'live-test'}
          audit = mode == 'health' or (mode == 'publish' and not proceed and os.environ['GITHUB_EVENT_NAME'] == 'schedule')
          audit_date = os.environ.get('PUBLICATION_DATE') if mode == 'health' else closed_publication_date(now)
          if mode == 'health' and not audit_date:
              audit_date = closed_publication_date(now)
          from datetime import date
          try:
              audit_date = date.fromisoformat(audit_date).isoformat()
          except (TypeError, ValueError):
              audit, audit_date = False, ''
              if mode == 'health':
                  proceed, reason = False, 'invalid_publication_date'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'proceed={str(proceed).lower()}\nmode={mode}\naudit={str(audit).lower()}\naudit_date={audit_date}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write(f"### Publication gate\n\nEastern date: {result['date']}\n\nRequested mode: {mode}\n\nPublishing will proceed: {'yes' if publishing else 'no'}\n\nGate reason: {reason}\n")
          if mode == 'publish' and not proceed:
              print(f'::notice::Publishing skipped: {reason}')
          print({'proceed': proceed, 'mode': mode, 'date': result['date'], 'reason': reason})
          PY

  local:
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && (needs.gate.outputs.mode == 'plan' || needs.gate.outputs.mode == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10.4,<13'
      - if: needs.gate.outputs.mode == 'preview'
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y ffmpeg fonts-dejavu-core
      - name: Local-only run; no publishing credentials or artifact uploads
        env:
          LOCAL_MODE: ${{ needs.gate.outputs.mode }}
        run: python -B Agents/Jalapeno/guess_wing_spot_main.py "$LOCAL_MODE"

  checks:
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && (needs.gate.outputs.mode == 'publish' || needs.gate.outputs.mode == 'live-test' || needs.gate.outputs.mode == 'validate')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      META_LONG_LIVED_ACCESS_TOKEN: ${{ secrets.META_LONG_LIVED_ACCESS_TOKEN }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
      GUESS_EXPECTED_INSTAGRAM_USERNAME: ${{ vars.GUESS_EXPECTED_INSTAGRAM_USERNAME }}
      GUESS_EXPECTED_FACEBOOK_NAME: ${{ vars.GUESS_EXPECTED_FACEBOOK_NAME }}
      GUESS_WING_SPOT_ENABLED: ${{ vars.GUESS_WING_SPOT_ENABLED || 'false' }}
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      JALAPENO_SCHEDULER: ${{ vars.JALAPENO_SCHEDULER || 'github' }}
      PUBLICATION_DATE: ${{ inputs.publication_date || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10.4,<13' 'requests>=2.32,<3' 'pytest>=8,<10' 'tzdata>=2024.1' 'PyYAML>=6,<7'
      - run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y ffmpeg tesseract-ocr fonts-dejavu-core
      - name: Focused source safety, scheduler, claims, provider and render tests
        env:
          GUESS_TEST_FFMPEG: ffmpeg
          GUESS_TEST_FFPROBE: ffprobe
        run: python -B -m pytest Agents/Jalapeno/tests/test_guess_wing_spot.py Agents/Jalapeno/tests/test_guess_wing_spot_publish.py -q -o cache_dir="$RUNNER_TEMP/guess-tests-cache" --basetemp="$RUNNER_TEMP/guess-tests"
      - name: Read-only provider and private-storage validation
        run: python -B Agents/Jalapeno/guess_wing_spot_publish.py validate
      - name: Resume or publish this Eastern date, independently per platform
        if: needs.gate.outputs.mode == 'publish' || needs.gate.outputs.mode == 'live-test'
        env:
          PUBLISH_MODE: ${{ needs.gate.outputs.mode }}
        run: python -B Agents/Jalapeno/guess_wing_spot_publish.py "$PUBLISH_MODE"

  health:
    needs: gate
    if: needs.gate.outputs.audit == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GUESS_WING_SPOT_ENABLED: ${{ vars.GUESS_WING_SPOT_ENABLED || 'false' }}
      PUBLICATION_DATE: ${{ needs.gate.outputs.audit_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3' 'tzdata>=2024.1'
      - name: Verify daily platform ledger without claims, uploads or provider calls
        run: python -B Agents/Jalapeno/guess_wing_spot_publish.py health

appId: com.buffago.app
name: Returning app navigation assertions
tags: [smoke, non-mutating, authenticated]
---
- runFlow:
    when:
      visible:
        id: nav.crawl
    commands:
      - tapOn:
          id: nav.crawl
      - assertVisible:
          id: nav.crawl
      - takeScreenshot: authenticated-crawl
- runFlow:
    when:
      visible:
